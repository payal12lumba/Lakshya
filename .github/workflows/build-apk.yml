name: Build Lakshya APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK (already on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        run: npm install

      - name: Copy the web app into www/
        run: npm run web

      - name: Add Android platform
        run: npx cap add android

      - name: Put in the Lakshya icon and splash screen
        run: |
          if [ -f resources/icon-only.png ]; then
            npx capacitor-assets generate --android --splashBackgroundColor '#F6F3FA'
          else
            echo "resources/ folder not found - using default icon"
          fi

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Same signing key and a new version number every build
        run: |
          mkdir -p keystore
          echo "" | base64 -d > keystore/lakshya.jks
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  lakshya {
                      storeFile file("../../keystore/lakshya.jks")
                      storePassword "lakshya2026"
                      keyAlias "lakshya"
                      keyPassword "lakshya2026"
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VCODE") ?: "1")
                  versionName "1." + (System.getenv("VCODE") ?: "1")
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lakshya
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Point Gradle to the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        env:
          VCODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Lakshya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lakshya-APK
          path: Lakshya.apk

      - name: Publish it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Lakshya 1.${{ github.run_number }}
          body: Download Lakshya.apk below and install it over the old app (don't uninstall first).
          files: Lakshya.apk
          make_latest: true
