name: Build Lakshya APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#F3F5F8'

      - name: Sync web files
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app and keep your ticks)
        run: |
          mkdir -p ~/.android
          cp lakshya-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lakshya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lakshya-APK
          path: Lakshya.apk
