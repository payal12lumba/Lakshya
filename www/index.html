<style>
:root{--bg:#F6F3FA;--bg2:#FFFFFF;--card:rgba(255,255,255,.66);--card2:rgba(255,255,255,.55);--line:rgba(155,110,160,.22);--line2:rgba(90,75,120,.12);--ink:#3E3656;--muted:#857C9C;--gold:#A9789F;--gold2:#8A5C82;--track:rgba(90,75,120,.10);--done:#5FA88A;--doneBg:rgba(95,168,138,.14);--later:#C08A3E;--laterBg:rgba(232,180,110,.18);--no:#8A8598;--noBg:rgba(138,133,152,.14);--ext:#C25E6E;--extBg:rgba(232,140,155,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100%}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9;will-change:transform}
.bgfx i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,#F7CFE0 0%,transparent 65%);animation:d1 28s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:50vmax;height:50vmax;right:-22vmax;top:20vh;background:radial-gradient(circle,#CFE9DF 0%,transparent 62%);animation:d2 34s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:55vmax;height:55vmax;left:-10vmax;bottom:-30vmax;background:radial-gradient(circle,#D9D3F6 0%,transparent 64%);animation:d3 40s ease-in-out infinite alternate}
.bgfx b{position:absolute;inset:0;background-image:radial-gradient(rgba(110,90,140,.10) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 75%)}
@keyframes d1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(.9)}}
@keyframes d3{to{transform:translate(14vmax,-16vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.bgfx i{animation:none}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 14px 60px}
.brand{display:flex;align-items:center;gap:12px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;color:var(--gold2)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:var(--gold);color:#FFFFFF}
.lay{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.lay button{border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer}
.lay button.on{border-color:var(--gold);color:var(--gold2)}
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dt{flex:0 0 54px;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:7px 0 8px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dt b{display:block;font-family:"Instrument Serif",Georgia,serif;font-size:23px;font-weight:400;line-height:1.1}
.dt span{font-size:11px;color:var(--muted)}
.dt i{display:block;height:3px;margin:6px 10px 0;border-radius:3px;background:var(--track)}
.dt i em{display:block;height:100%;border-radius:3px;background:var(--gold)}
.dt.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}.dt.on span{color:rgba(255,255,255,.85)}.dt.on i{background:rgba(255,255,255,.35)}.dt.on i em{background:#FFFFFF}
.dt.today:not(.on){border-color:var(--gold)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 12px}
.dayhead h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:27px;margin:0;line-height:1.15}
.ring{width:46px;height:46px;flex:0 0 46px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(120,90,150,.08);border-radius:18px;padding:15px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:#F6E3EE;color:#8A5C82}
.tag.imp{background:#E6EEF8;color:#5B7194}
.meta{font-size:12px;color:var(--muted)}
.tp{font-weight:700;font-size:16px;margin:8px 0 2px;line-height:1.35}
.area{font-size:12px;color:var(--muted)}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px;display:flex;justify-content:space-between;letter-spacing:.02em}
.res{margin:10px 0 2px;font-size:13px;font-weight:700;color:var(--gold2)}
.ext{font-size:10.5px;font-weight:700;color:var(--ext);background:var(--extBg);border-radius:5px;padding:0 5px;margin-left:5px}
.it{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:9px;cursor:pointer;user-select:none;-webkit-user-select:none}
.it:active{background:rgba(169,120,159,.08)}
.bx{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid rgba(110,90,140,.35);background:#fff;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.it.ck .bx{background:var(--done);border-color:var(--done)}
.it.ck .bx:after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.it .t{font-size:13.5px}.it.ck .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(133,124,156,.5)}
.addon{background:rgba(247,207,224,.28);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer}
.chip.on[data-s="Needed"]{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
.chip.on[data-s="Not needed"]{background:var(--noBg);border-color:var(--no);color:var(--no)}
.chip.on[data-s="Do it later"]{background:var(--laterBg);border-color:var(--later);color:var(--later)}
.chip.on[data-s="Done"]{background:var(--doneBg);border-color:var(--done);color:var(--done)}
.bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:10px}.bar em{display:block;height:100%;background:var(--done);transition:width .3s}
.note{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}
.donebadge{font-size:11px;font-weight:700;color:var(--done);background:var(--doneBg);border-radius:6px;padding:2px 9px}
.addon.dim{opacity:.5}
.cl .grp{border-bottom:1px solid var(--line2);padding:11px 0}
.cl .grp:last-child{border-bottom:0}
.cl .hd{display:flex;gap:10px;align-items:center;cursor:pointer}
.cl .hd .tp{font-size:14.5px;margin:0;flex:1}
.cl .pc{font-size:12px;font-weight:700;color:var(--muted);min-width:38px;text-align:right}
.tog{font:inherit;font-size:12px;font-weight:700;color:var(--gold);background:none;border:0;padding:6px 0 0;cursor:pointer}
.pl{position:relative;padding-left:62px}
.pl:before{content:"";position:absolute;left:44px;top:6px;bottom:6px;width:1.5px;background:var(--line);border-radius:2px}
.blk{position:relative;margin-bottom:14px}
.blk .hr{position:absolute;left:-62px;top:4px;width:40px;text-align:right;font-family:"Instrument Serif",Georgia,serif;font-size:15px;color:var(--muted)}
.blk .dot{position:absolute;left:-23px;top:8px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--gold)}
.blk.dn .dot{background:var(--done);border-color:var(--done)}
.blk .card{margin:0;padding:13px}
.blk .card .hdr{cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
button:focus-visible,.it:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(120,90,150,.08);border-radius:16px;padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.kpi .v{font-family:"Instrument Serif",Georgia,serif;font-size:30px;line-height:1.1;color:var(--gold2)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .s{font-size:11.5px;color:var(--muted)}
.ih{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:21px;margin:0 0 8px}
.ar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.ar:last-child{border-bottom:0}
.ar .n{font-size:13px;font-weight:600}.ar .c{font-size:12px;color:var(--muted);text-align:right;font-weight:700}
.ar .bar{grid-column:1/-1;margin-top:2px}
.ar.low .bar em{background:#E8A5C2}
.pace{font-size:13.5px;padding:10px 12px;border-radius:12px;margin-top:4px}
.pace.ok{background:var(--doneBg);color:#3E7F64}.pace.bh{background:var(--laterBg);color:#8E6224}
.lst .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.lst .row:last-child{border-bottom:0}
.lst .row .a{font-size:13.5px;font-weight:600}.lst .row .b{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart em{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--gold);min-height:2px}
.chart em.z{background:var(--track)}
.chart em.td{background:#E8A5C2}
.chart span{font-size:9.5px;color:var(--muted);margin-top:3px}
.sp{display:flex;gap:8px;flex-wrap:wrap}
.sp span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}

function areaOf(r){const m=/^(\d+)\./.exec(r.ar||'');return m?{k:+m[1],n:AREA[+m[1]]||r.ar}:{k:100,n:'Coding projects: '+r.ar}}
function logTick(on){const d=todayISO;S.log=S.log||{};S.log[d]=Math.max(0,(S.log[d]||0)+(on?1:-1))}
function streak(){const L=S.log||{};let c=0;const x=new Date(todayISO+'T00:00');const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');if(!(L[iso(x)]>0))x.setDate(x.getDate()-1);while(L[iso(x)]>0){c++;x.setDate(x.getDate()-1)}return c}
function agg(R){let d=0,n=0,h=0,hd=0,td=0;R.forEach(r=>{const p=prog(r);d+=p.d;n+=p.n;h+=+r.h||0;hd+=(+r.h||0)*p.p;if(rowDone(r))td++});return{d,n,p:n?d/n:0,h,hd,td,t:R.length}}
const pct=x=>Math.round(x*100)+'%';
function insights(){const ALL=P.theory.concat(P.coding);const A=agg(ALL),T=agg(P.theory),C=agg(P.coding);
const due=ALL.filter(r=>r.d<=todayISO),D=agg(due);const exp=D.n,gap=D.n-D.d;
const past=ALL.filter(r=>r.d<todayISO&&!rowDone(r));
const started=todayISO>=DATES[0];
let pace;if(!started)pace=`<div class="pace ok">Your plan starts on ${fmt(DATES[0]).long}.</div>`;else if(gap===0)pace=`<div class="pace ok">On track. Everything planned up to today is ticked.</div>`;else pace=`<div class="pace bh">${gap} must-do items planned up to today are still unticked (${pct(D.p)} of what's due is done).</div>`;
const g={};ALL.forEach(r=>{const a=areaOf(r);(g[a.k+'|'+a.n]=g[a.k+'|'+a.n]||[]).push(r)});
const areas=Object.keys(g).sort((x,y)=>parseInt(x)-parseInt(y)).map(k=>{const a=agg(g[k]);const nm=k.split('|')[1];const low=started&&a.p<.34&&g[k].some(r=>r.d<=todayISO);return`<div class="ar ${low?'low':''}"><span class="n">${esc(nm)}</span><span class="c">${pct(a.p)}</span><div class="bar"><em style="width:${a.p*100}%"></em></div></div>`}).join('');
const M=agg(ALL.filter(r=>r.p==='Must')),I=agg(ALL.filter(r=>r.p==='Important'));
const withA=ALL.filter(r=>r.A.length);const cnt={'Needed':0,'Do it later':0,'Not needed':0,'Done':0,'Not set':0};withA.forEach(r=>{cnt[addonStatus(r)||'Not set']++});
const later=withA.filter(r=>addonStatus(r)==='Do it later');
const L=S.log||{};const mx=Math.max(1,...DATES.map(d=>L[d]||0));
const chart=DATES.map(d=>{const v=L[d]||0;return`<div title="${v} ticks"><em class="${v?'':'z'} ${d===todayISO?'td':''}" style="height:${v?Math.max(6,v/mx*100):3}%"></em><span>${fmt(d).n}</span></div>`}).join('');
const rowLink=(r,extra)=>`<div class="row" data-go="${r.k}|${r.d}"><span class="a">${esc(r.tp)}</span><span class="b">${fmt(r.d).n} ${fmt(r.d).m} · ${r.k==='theory'?'Conceptual':'Coding'}${extra||''}</span></div>`;
return`<div class="dayhead"><div><h2>Insights</h2><div class="sub">13 Oct – 3 Nov · both tabs together</div></div></div>
<div class="kp">
<div class="kpi"><div class="l">Overall</div><div class="v">${pct(A.p)}</div><div class="s">${A.d} of ${A.n} items · ${A.td} of ${A.t} topics</div></div>
<div class="kpi"><div class="l">Hours covered</div><div class="v">${Math.round(A.hd*10)/10}</div><div class="s">of ${Math.round(A.h*10)/10} planned hours</div></div>
<div class="kpi"><div class="l">Conceptual</div><div class="v">${pct(T.p)}</div><div class="s">${T.td} of ${T.t} topics done</div></div>
<div class="kpi"><div class="l">Coding</div><div class="v">${pct(C.p)}</div><div class="s">${C.td} of ${C.t} topics done</div></div>
<div class="kpi"><div class="l">Streak</div><div class="v">${streak()} ${streak()===1?'day':'days'}</div><div class="s">days in a row with a tick</div></div>
<div class="kpi"><div class="l">Must vs Important</div><div class="v" style="font-size:24px">${pct(M.p)} · ${pct(I.p)}</div><div class="s">Must · Important</div></div>
</div>
<div class="card"><h3 class="ih">Pace</h3>${pace}${past.length?`<div class="sec"><span>Pending from earlier days</span><span>${past.length}</span></div><div class="lst">${past.slice(0,12).map(r=>{const p=prog(r);return rowLink(r,` · ${p.d}/${p.n}`)}).join('')}</div>${past.length>12?`<div class="meta" style="margin-top:6px">and ${past.length-12} more</div>`:''}`:''}</div>
<div class="card"><h3 class="ih">Ticks per day</h3><div class="chart">${chart}</div><div class="meta" style="margin-top:6px">Counts ticks from the day you made them. Today is in pink.</div></div>
<div class="card"><h3 class="ih">By syllabus area</h3>${areas}<div class="meta" style="margin-top:8px">Pink bars are areas under 34% with topics already due.</div></div>
<div class="card"><h3 class="ih">Add-ons</h3><div class="sp"><span style="background:#F6E3EE;color:#8A5C82">Needed ${cnt['Needed']}</span><span style="background:var(--laterBg);color:#8E6224">Do it later ${cnt['Do it later']}</span><span style="background:var(--noBg);color:var(--no)">Not needed ${cnt['Not needed']}</span><span style="background:var(--doneBg);color:#3E7F64">Done ${cnt['Done']}</span><span style="background:var(--track);color:var(--muted)">Not set ${cnt['Not set']}</span></div>
${later.length?`<div class="sec"><span>Do it later</span><span>${later.length}</span></div><div class="lst">${later.map(r=>rowLink(r)).join('')}</div>`:`<div class="meta" style="margin-top:10px">Add-ons you mark "Do it later" will collect here.</div>`}</div>`}
function render(){S.tab=tab;S.lay=lay;S.cur=cur;save();
document.getElementById('lay').innerHTML=[['cards','Cards'],['check','Checklist'],['plan','Day planner']].map(([k,l])=>`<button class="${lay===k?'on':''}" data-lay="${k}">${l}</button>`).join('');
document.getElementById('tabs').innerHTML=[['theory','Conceptual'],['coding','Coding'],['insights','Insights']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
const isI=tab==='insights';document.getElementById('lay').style.display=isI?'none':'';document.getElementById('dates').style.display=isI?'none':'';if(isI){const A=agg(P.theory.concat(P.coding));document.getElementById('ov').textContent=`Overall · ${A.td} of ${A.t} topics done`;ring(A.p,document.getElementById('ovring'));document.getElementById('main').innerHTML=insights();return}
const dEl=document.getElementById('dates');const sl=dEl.scrollLeft;
dEl.innerHTML=DATES.map(d=>{const f=fmt(d);return`<button class="dt ${d===cur?'on':''} ${d===todayISO?'today':''}" data-d="${d}"><span>${f.w}</span><b>${f.n}</b><span>${f.m}</span><i><em style="width:${dayPct(d,tab)*100}%"></em></i></button>`}).join('');dEl.scrollLeft=sl;
const R=rowsFor(cur,tab);const all=P[tab];let a=0,b=0;all.forEach(r=>{const p=prog(r);a+=p.d;b+=p.n});
document.getElementById('ov').textContent=`${tab==='theory'?'Conceptual':'Coding'} · ${all.filter(rowDone).length} of ${all.length} topics done`;ring(b?a/b:0,document.getElementById('ovring'));
const f=fmt(cur),hrs=R.reduce((s,r)=>s+(+r.h||0),0);
document.getElementById('main').innerHTML=`<div class="dayhead"><div><h2>${f.long}</h2><div class="sub">${R.length} topics · ${hrs} hrs ${tab==='theory'?'conceptual':'coding'}</div></div><svg class="ring" id="dring" viewBox="0 0 46 46"></svg></div>`+(R.length?(lay==='cards'?cardsL(R):lay==='check'?checkL(R):planL(R)):'<div class="empty">Nothing planned in this tab for this day.</div>');
ring(dayPct(cur,tab),document.getElementById('dring'))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-s],[data-tab],[data-lay],[data-d],[data-open],[data-go]');if(!t)return;
if(t.dataset.go){const[k,d]=t.dataset.go.split('|');tab=k;cur=d;render();const on=document.querySelector('.dt.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0);return}
if(t.dataset.id){S.t[t.dataset.id]=!S.t[t.dataset.id];logTick(S.t[t.dataset.id])}
else if(t.dataset.s){const k=t.dataset.r;S.a[k]=S.a[k]===t.dataset.s?null:t.dataset.s;if(t.dataset.s==='Done')ids(ROWS[k],'a').forEach(x=>{if(!S.t[x]){S.t[x]=true;logTick(true)}})}
else if(t.dataset.tab)tab=t.dataset.tab;else if(t.dataset.lay)lay=t.dataset.lay;else if(t.dataset.d){cur=t.dataset.d}
else if(t.dataset.open){S.open[t.dataset.open]=!S.open[t.dataset.open]}
render()});
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.dataset&&e.target.dataset.id){e.preventDefault();e.target.click()}});
render();const on=document.querySelector('.dt.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
</script></body></html>
